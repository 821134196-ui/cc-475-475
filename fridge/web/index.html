<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写字楼公共冰箱格位与过期清理系统</title>
<style>
:root{
  --bg:#F7F9F8; --card:#FFFFFF; --mint:#3FBF9B; --mint-soft:#E3F5EF;
  --mint-deep:#2E9C7D; --dark:#2E3A38; --gray:#6B7A77; --line:#DDE6E3;
  --warn:#E0A13C; --warn-soft:#FBF1DE; --bad:#D96A55; --bad-soft:#FAECE8;
  --blue:#5B8DEF; --shadow:0 1px 3px rgba(46,58,56,.07),0 4px 16px rgba(46,58,56,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--dark);font-size:14px;line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--line);
  padding:0 24px;display:flex;align-items:center;gap:16px;height:60px;
  position:sticky;top:0;z-index:20}
.logo{width:30px;height:30px;border-radius:8px;background:var(--mint);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
h1{font-size:16px;font-weight:700}
.sub{color:var(--gray);font-size:12px}
.actor{margin-left:auto;display:flex;align-items:center;gap:8px}
.actor select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--dark);font-size:13px}
.role-tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--mint-soft);
  color:var(--mint-deep);font-weight:600}
nav{background:var(--card);border-bottom:1px solid var(--line);
  padding:0 24px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:60px;z-index:19}
nav button{background:none;border:none;padding:13px 14px;font-size:13.5px;color:var(--gray);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button.active{color:var(--mint-deep);border-bottom-color:var(--mint);font-weight:600}
nav button:hover{color:var(--dark)}
main{max-width:1120px;margin:22px auto;padding:0 24px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h2{font-size:15px;margin-bottom:4px}
.card .hint{color:var(--gray);font-size:12.5px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
button.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13.5px;cursor:pointer;
  background:var(--mint);color:#fff;font-weight:600;transition:.15s}
button.btn:hover{background:var(--mint-deep)}
button.btn.ghost{background:#fff;color:var(--dark);border:1px solid var(--line)}
button.btn.ghost:hover{border-color:var(--mint);color:var(--mint-deep)}
button.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
button.btn.warn{background:var(--warn)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;font-family:inherit;color:var(--dark);background:#fff}
label.fld{display:block;font-size:12.5px;color:var(--gray);margin:10px 0 4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.badge.mint{background:var(--mint-soft);color:var(--mint-deep)}
.badge.gray{background:#EEF2F1;color:var(--gray)}
.badge.warn{background:var(--warn-soft);color:#9A6E1F}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.blue{background:#E8F0FE;color:#3A66B8}
/* 格位图 */
.fridge{border:1px solid var(--line);border-radius:12px;background:#fff;
  padding:16px 18px;position:relative;overflow:hidden}
.fridge.outage{background:#F2F4F3}
.fridge-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fridge-title h3{font-size:14px}
.shelf{display:flex;gap:7px;margin:0 auto 9px;align-items:stretch}
.shelf-label{width:34px;flex:0 0 34px;color:var(--gray);font-size:11px;
  display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.cell{flex:1;min-width:0;aspect-ratio:1.55/1;border:1.5px dashed var(--line);border-radius:8px;
  background:#FBFCFC;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:default;padding:2px;position:relative;transition:.12s}
.cell .code{font-size:9.5px;color:#A9B5B2}
.cell.occupied{border-style:solid;border-color:var(--mint);background:var(--mint-soft);cursor:pointer}
.cell.due{border-color:var(--bad);background:var(--bad-soft)}
.cell .dept{font-weight:700;font-size:13px;line-height:1.1}
.cell .dt{font-size:9.5px;color:var(--gray)}
.cell.due .dt{color:var(--bad)}
.cell.held{border-color:var(--warn);background:var(--warn-soft);
  animation:pulse 1.2s infinite}
.cell.free-pick{cursor:pointer}
.cell.free-pick:hover{border-color:var(--mint);background:var(--mint-soft)}
.cell.picked{border-color:var(--mint-deep);background:var(--mint);border-style:solid}
.cell.picked .code{color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.overlay-outage{position:absolute;inset:0;background:rgba(247,249,248,.82);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;z-index:2}
/* 收件箱列表 */
.inbox{list-style:none;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.inbox li{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);
  background:#fff;align-items:flex-start;cursor:pointer}
.inbox li:last-child{border-bottom:none}
.inbox li:hover{background:#FAFCFB}
.ava{width:34px;height:34px;border-radius:9px;background:var(--mint-soft);color:var(--mint-deep);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto}
.ava.warn{background:var(--warn-soft);color:#9A6E1F}
.ava.bad{background:var(--bad-soft);color:var(--bad)}
.mail-main{flex:1;min-width:0}
.mail-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mail-subj{font-weight:600;font-size:13.5px}
.mail-snip{color:var(--gray);font-size:12.5px;margin-top:2px}
.mail-time{color:var(--gray);font-size:11.5px;white-space:nowrap;margin-left:auto}
.photo-wrap{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  display:inline-block;background:#fff;max-width:340px}
.photo-wrap img{display:block;width:100%}
.chevron{color:var(--gray);transition:.2s;align-self:center}
li.open .chevron{transform:rotate(90deg)}
/* 步骤 */
.steps{display:flex;gap:0;margin:6px 0 18px}
.step{flex:1;text-align:center;position:relative;font-size:12.5px;color:var(--gray)}
.step .n{width:26px;height:26px;border-radius:50%;background:#EEF2F1;color:var(--gray);
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:5px}
.step.active .n{background:var(--mint);color:#fff}
.step.done .n{background:var(--mint-soft);color:var(--mint-deep)}
.step:not(:last-child)::after{content:"";position:absolute;top:13px;left:56%;right:-44%;
  height:2px;background:var(--line)}
.step.done:not(:last-child)::after{background:var(--mint)}
.step b{display:block}
.door{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;
  background:var(--warn-soft);color:#9A6E1F;font-weight:600;font-size:13px}
.door .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);animation:pulse 1.2s infinite}
.door.closed{background:#EEF2F1;color:var(--gray)}
.door.closed .dot{background:var(--gray);animation:none}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--dark);color:#fff;padding:11px 20px;border-radius:10px;font-size:13.5px;
  box-shadow:0 8px 28px rgba(0,0,0,.22);opacity:0;transition:.25s;max-width:80vw}
.toast.show{opacity:1}
.toast.err{background:var(--bad)}
.toast.ok{background:var(--mint-deep)}
.undo-card{border:2px solid var(--mint);background:var(--mint-soft);border-radius:12px;padding:18px;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--gray);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #EDF2F0;vertical-align:middle}
tr:last-child td{border-bottom:none}
.pill-count{background:var(--bad);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;margin-left:5px}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-tabs button{padding:6px 13px;border-radius:20px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;color:var(--gray);cursor:pointer}
.filter-tabs button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.empty{text-align:center;color:var(--gray);padding:34px 0;font-size:13px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--gray);font-size:12px;margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kv{display:flex;gap:6px;font-size:12.5px;color:var(--gray);flex-wrap:wrap}
.kv b{color:var(--dark);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="logo">冰</div>
  <div>
    <h1>公共冰箱格位与过期清理</h1>
    <div class="sub">写字楼物业 · 格位登记 / 到期清理 / 停机迁移 / 申诉复核</div>
  </div>
  <div class="actor">
    <span class="sub">当前操作人</span>
    <select id="actorSel"></select>
    <span class="role-tag" id="roleTag"></span>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const state={users:[],actor:null,view:'map',issueFilter:'unlabeled',storeStep:1,
  store:{uid:null,label:null,cell:null,token:null,itemId:null},tempFridge:'F1'};

async function api(path,body){
  const opt=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};
  const r=await fetch(path,opt); const d=await r.json();
  if(!r.ok) throw new Error(d.message||d.error||'操作失败');
  return d;
}
function toast(msg,kind=''){const t=$('#toast');t.textContent=msg;t.className='toast show '+kind;
  clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2600);}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function roleName(r){return {employee:'租户员工',tenant_admin:'租户管理员',cleaner:'保洁',property:'物业'}[r]||r;}
function deptShort(id){const u=state.users.find(x=>x.id===id);return u?u.dept_short:'';}
function hh(s){return s?s.substring(5,16):'';}

const VIEWS=[
 ['map','冰箱格位图'],['store','快速存放'],['expiry','到期队列'],['clean','清理批次'],
 ['outage','停机迁移'],['temp','温度记录'],['appeal','申诉复核'],['hygiene','卫生巡检']];

async function boot(){
  state.users=await api('/api/users');
  const saved=localStorage.getItem('actor');
  state.actor=state.users.find(u=>u.id===saved)||state.users[0];
  $('#actorSel').innerHTML=state.users.map(u=>
    `<option value="${u.id}" ${u.id===state.actor.id?'selected':''}>${esc(u.name)}（${esc(u.dept_short||'')}·${roleName(u.role)}）</option>`).join('');
  $('#actorSel').onchange=e=>{state.actor=state.users.find(u=>u.id===e.target.value);
    localStorage.setItem('actor',state.actor.id);render();};
  $('#nav').innerHTML=VIEWS.map(([k,n],i)=>
    `<button data-v="${k}" class="${k===state.view?'active':''}">${n}${k==='expiry'?'<span class="pill-count" id="expCnt"></span>':''}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.view=b.dataset.v;render();});
  render();
}
function render(){
  $('#roleTag').textContent=roleName(state.actor.role);
  $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.v===state.view));
  ({map:viewMap,store:viewStore,expiry:viewExpiry,clean:viewBatches,outage:viewOutage,
    temp:viewTemp,appeal:viewAppeal,hygiene:viewHygiene})[state.view]();
}

/* ---------------- 冰箱格位图 ---------------- */
async function viewMap(){
  const data=await api('/api/map');
  const m=$('#main');
  m.innerHTML=data.map(g=>{
    const w=Math.round(g.fridge.width_ratio*100);
    const shelves=[];
    for(let s=1;s<=g.fridge.shelf_count;s++){
      const cells=g.cells.filter(c=>c.shelf===s).map(c=>{
        if(c.occupied)
          return `<div class="cell occupied ${c.state==='due'?'due':''}" title="${esc(c.label)} 存放 ${esc(c.stored_at)} 到期 ${esc(c.expire_at)}">
            <span class="dept">${esc(c.dept_short)}</span><span class="dt">${esc(c.stored_at)}</span></div>`;
        if(c.held) return `<div class="cell held"><span class="code">${c.code}</span><span class="dt">待关门</span></div>`;
        return `<div class="cell"><span class="code">${c.code}</span></div>`;
      }).join('');
      shelves.push(`<div class="shelf" style="width:${w}%"><div class="shelf-label">L${s}</div>${cells}</div>`);
    }
    return `<div class="card"><div class="fridge ${g.fridge.status==='outage'?'outage':''}">
      <div class="fridge-title"><h3>${esc(g.fridge.name)}</h3>
        ${g.fridge.status==='outage'?'<span class="badge gray">临时停机</span>':'<span class="badge mint">运行中</span>'}
        <span class="kv" style="margin-left:auto"><b>${g.cells.filter(c=>c.occupied).length}</b>/${g.cells.length} 格占用</span>
      </div>${shelves.join('')}
      ${g.fridge.status==='outage'?`<div class="overlay-outage"><b style="font-size:16px">冰箱停机中</b>
        <span class="sub">预计恢复 ${hh(g.fridge.resume_at)} · 未到期物品由物业批量迁移</span></div>`:''}
      <div class="legend"><span><i style="background:var(--mint-soft);border:1px solid var(--mint)"></i>在存</span>
        <span><i style="background:var(--bad-soft);border:1px solid var(--bad)"></i>已到期待清理</span>
        <span><i style="background:var(--warn-soft);border:1px dashed var(--warn)"></i>开门待确认</span>
        <span class="sub">标签仅显示部门简称与存放日期，层架按冰箱宽度比例绘制</span></div>
    </div></div>`;
  }).join('');
  api('/api/expiry').then(q=>{const c=$('#expCnt');if(c)c.textContent=q.length;});
}

/* ---------------- 快速存放（三步） ---------------- */
async function viewStore(){
  const labels=await api('/api/labels');
  const s=state.store;
  const m=$('#main');
  const unused=labels.filter(l=>!l.used&&!l.revoked);
  m.innerHTML=`
  <div class="card">
    <h2>快速存放</h2><div class="hint">贴签 → 选空余格位 → 关门确认，三步完成；格位仅第一件存放成功。</div>
    <div class="steps">
      <div class="step ${state.storeStep===1?'active':state.storeStep>1?'done':''}"><span class="n">1</span><b>物品贴签</b></div>
      <div class="step ${state.storeStep===2?'active':state.storeStep>2?'done':''}"><span class="n">2</span><b>选空余格位</b></div>
      <div class="step ${state.storeStep===3?'active':''}"><span class="n">3</span><b>关门确认</b></div>
    </div>
    <div id="stepBody"></div>
  </div>`;
  const body=$('#stepBody');
  if(state.storeStep===1){
    body.innerHTML=`
      <div class="grid2">
        <div>
          <label class="fld">贴签员工（标签绑定部门）</label>
          <select id="labUser">${state.users.filter(u=>u.role==='employee'||u.role==='tenant_admin')
            .map(u=>`<option value="${u.id}" ${u.id===state.actor.id?'selected':''}>${esc(u.name)}（${esc(u.dept_short)}）</option>`).join('')}</select>
          <div class="row" style="margin-top:14px"><button class="btn" id="mkLab">生成新标签</button>
          <button class="btn ghost" id="useOld">使用已有空签</button></div>
          <p class="hint" style="margin-top:10px">一物品一签；已使用标签再次扫码会提示“重复扫码”，已作废标签提示“标签失效”。</p>
        </div>
        <div id="labPreview" class="hint" style="display:flex;align-items:center;justify-content:center;
          border:1px dashed var(--line);border-radius:10px;min-height:150px">标签预览区</div>
      </div>`;
    $('#mkLab').onclick=async()=>{
      try{const d=await api('/api/label',{uid:$('#labUser').value});
        state.store.label=d.code;state.store.uid=d.uid;state.storeStep=2;render();
        toast('标签已生成：'+d.code,'ok');
      }catch(e){toast(e.message,'err');}
    };
    $('#useOld').onclick=()=>{
      if(!unused.length)return toast('暂无未使用标签，请生成新签','err');
      state.store.label=unused[0].code;state.store.uid=unused[0].user_id;
      state.storeStep=2;render();
    };
  }
  if(state.storeStep===2){
    body.innerHTML=`<div class="row" style="margin-bottom:10px">
        <span>当前标签 <b id="labCode">${esc(s.label)}</b></span>
        <button class="btn ghost" id="back1">返回上一步</button></div>
      <div id="pickMap"></div>`;
    $('#back1').onclick=()=>{state.storeStep=1;render();};
    const data=await api('/api/map');
    $('#pickMap').innerHTML=data.filter(g=>g.fridge.status!=='outage').map(g=>{
      const w=Math.round(g.fridge.width_ratio*100);
      const shelves=[];
      for(let sh=1;sh<=g.fridge.shelf_count;sh++){
        const cells=g.cells.filter(c=>c.shelf===sh).map(c=>{
          if(c.occupied)return `<div class="cell occupied ${c.state==='due'?'due':''}"><span class="dept">${esc(c.dept_short)}</span><span class="dt">${esc(c.stored_at)}</span></div>`;
          if(c.held)return `<div class="cell held"><span class="code">${c.code}</span></div>`;
          return `<div class="cell free-pick" data-cell="${c.code}"><span class="code">${c.code}</span><span class="dt">空余</span></div>`;
        }).join('');
        shelves.push(`<div class="shelf" style="width:${w}%"><div class="shelf-label">L${sh}</div>${cells}</div>`);
      }
      return `<div class="fridge" style="margin-bottom:14px"><div class="fridge-title"><h3>${esc(g.fridge.name)}</h3></div>${shelves.join('')}</div>`;
    }).join('');
    $('#pickMap').querySelectorAll('.free-pick').forEach(el=>el.onclick=async()=>{
      const cell=el.dataset.cell;
      try{
        const d=await api('/api/store/start',{uid:s.uid,label:s.label,cell});
        state.store.cell=cell;state.store.token=d.token;state.store.itemId=d.item_id;
        state.storeStep=3;render();
      }catch(e){toast(e.message,'err');}
    });
  }
  if(state.storeStep===3){
    body.innerHTML=`
      <div class="grid2">
        <div>
          <div class="door"><span class="dot"></span>门磁：OPEN 门已打开</div>
          <p class="hint" style="margin-top:12px">物品 <b>${esc(s.label)}</b> 已暂存登记，目标格位 <b>${esc(s.cell)}</b>。<br>
          请放入物品并关门，点击下方按钮完成存放（30 秒内有效）。</p>
          <div class="row" style="margin-top:8px">
            <button class="btn" id="confirmBtn">✔ 关门确认，完成存放</button>
            <button class="btn ghost" id="cancelBtn">取消</button>
          </div>
        </div>
        <div style="border:1px dashed var(--line);border-radius:10px;padding:16px" id="result">
          <p class="hint">关门后格位才会真正占用；若格位同时被他人抢先，将提示仅首个成功。</p></div>
      </div>`;
    $('#cancelBtn').onclick=()=>{state.storeStep=1;Object.assign(state.store,{label:null,cell:null,token:null});render();};
    $('#confirmBtn').onclick=async()=>{
      try{
        const d=await api('/api/store/confirm',{uid:s.uid,token:s.token});
        $('#result').innerHTML=`<div class="undo-card">
          <div style="font-size:15px;font-weight:700">✔ 存放完成</div>
          <p class="hint" style="margin:8px 0 12px">格位 <b>${esc(d.cell)}</b><br>
          存放 ${hh(d.stored_at)} ｜ 保留至 ${hh(d.expire_at)}（48 小时）</p>
          <button class="btn danger" id="undoBtn">↩ 撤销此存放（释放格位）</button></div>`;
        state.storeStep=0;
        $('#undoBtn').onclick=async()=>{
          try{await api('/api/store/undo',{uid:s.uid,item_id:d.item_id});

function drawChart(pts,limits){
  const W=1040,H=260,L=44,R=16,T=18,B=30;
  if(!pts.length){$('#chart').innerHTML='<div class="empty">暂无读数</div>';return;}
  const vals=pts.map(p=>p.value);
  let ymin=Math.min(0,Math.floor(Math.min(...vals))), ymax=Math.max(12,Math.ceil(Math.max(...vals))+1);
  const x=i=>L+(W-L-R)*(pts.length===1?0:i/(pts.length-1));
  const y=v=>T+(H-T-B)*(1-(v-ymin)/(ymax-ymin));
  const line=pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.value)).join(' ');
  let grid='';
  for(let v=Math.ceil(ymin);v<=ymax;v+=2)
    grid+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#EEF2F0"/>
      <text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#6B7A77">${v}°</text>`;
  const band=`<rect x="${L}" y="${y(limits[1])}" width="${W-L-R}" height="${y(limits[0])-y(limits[1])}" fill="#E3F5EF" opacity=".55"/>
    <line x1="${L}" y1="${y(limits[1])}" x2="${W-R}" y2="${y(limits[1])}" stroke="#E0A13C" stroke-dasharray="5 4"/>`;
  const dots=pts.map((p,i)=>p.alarm
    ?`<circle cx="${x(i)}" cy="${y(p.value)}" r="4.5" fill="#D96A55" stroke="#fff" stroke-width="1.5"/>`
    :'').join('');
  $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" id="csvg">
    ${grid}${band}
    <path d="${line}" fill="none" stroke="#3FBF9B" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    <line id="cx" y1="${T}" y2="${H-B}" stroke="#2E3A38" stroke-width="1" opacity="0"/>
    <g id="tip" style="display:none"><rect id="tbox" width="118" height="42" rx="7" fill="#2E3A38"/>
      <text id="t1" fill="#fff" font-size="11" font-weight="700"></text>
      <text id="t2" fill="#9FD9C8" font-size="10"></text></g>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="hover"/>
  </svg>`;
  const svg=$('#csvg'),hb=$('#hover');
  hb.addEventListener('mousemove',e=>{
    const rect=svg.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width);
    const i=Math.round((mx-L)/((W-L-R)/(pts.length-1)));
    if(i<0||i>=pts.length)return;
    $('#cx').setAttribute('x1',x(i));$('#cx').setAttribute('x2',x(i));$('#cx').setAttribute('opacity',.35);
    const g=$('#tip');g.style.display='';
    $('#tbox').setAttribute('x',Math.min(x(i)+8,W-128));$('#tbox').setAttribute('y',Math.max(y(pts[i].value)-46,T));
    $('#t1').setAttribute('x',Math.min(x(i)+16,W-120));$('#t1').setAttribute('y',Math.max(y(pts[i].value)-28,T+14));
    $('#t2').setAttribute('x',Math.min(x(i)+16,W-120));$('#t2').setAttribute('y',Math.max(y(pts[i].value)-14,T+28));
    $('#t1').textContent=pts[i].value+'℃'+(pts[i].alarm?' 超限':'');
    $('#t2').textContent=pts[i].ts.substring(5);
  });
  hb.addEventListener('mouseleave',()=>{$('#tip').style.display='none';$('#cx').setAttribute('opacity',0);});
}

        <div class="mail-snip">${esc(it.detail)} · ${hh(it.ts)}</div>
        <div class="photoBox" hidden>${it.photo_url?`<div class="photo-wrap"><img src="${esc(it.photo_url)}"></div>`:''}
          ${it.status==='open'?`<div class="row" style="margin-top:10px">
            <input class="resText" placeholder="处理说明" style="flex:1;min-width:180px">
            <button class="btn resolveBtn">确认关闭（管理员/物业）</button></div>`:
            `<p class="sub" style="margin-top:6px">处理结果：${esc(it.resolution||'')} · ${esc(state.users.find(u=>u.id===it.handled_by)?.name||it.handled_by)}</p>`}
        </div>
      </div><span class="chevron">▶</span></li>`).join('')}</ul>`;
  box.querySelectorAll('li').forEach(li=>{
    li.onclick=e=>{
      if(e.target.closest('button')||e.target.closest('input')||e.target.closest('img'))return;
      const pb=li.querySelector('.photoBox');pb.hidden=!pb.hidden;li.classList.toggle('open');
    };
    const rb=li.querySelector('.resolveBtn');
    if(rb)rb.onclick=async()=>{
      try{await api('/api/issue/resolve',{uid:state.actor.id,issue_id:Number(li.dataset.iid),
        resolution:li.querySelector('.resText').value||'现场已处理'});
        toast('异常已关闭','ok');render();}
      catch(e){toast(e.message,'err');}
    };
  });
  $('#rptBtn').onclick=async()=>{
    const k=$('#rKind').value;
    try{
      if(k==='unlabeled')await api('/api/issue/unlabeled',{uid:state.actor.id,fridge_id:$('#rF').value,cell:$('#rCell').value,detail:$('#rDetail').value});
      else await api('/api/issue/leak',{uid:state.actor.id,fridge_id:$('#rF').value,cell:$('#rCell').value,detail:$('#rDetail').value});
      toast('已拍照登记','ok');render();
    }catch(e){toast(e.message,'err');}
  };
  $('#cBtn').onclick=async()=>{
    try{await api('/api/hygiene',{uid:state.actor.id,fridge_id:$('#cF').value,
      score:Number($('#cScore').value),finding:$('#cFind').value});
      toast('检查已提交','ok');render();}
    catch(e){toast(e.message,'err');}
  };
}
boot();
</script>
</body>
</html>
